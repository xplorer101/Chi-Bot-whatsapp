services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chibot
      POSTGRES_PASSWORD: chibot
      POSTGRES_DB: chibot
    ports:
      - "5432:5432"
    volumes:
      - chibot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chibot -d chibot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chibot_pgdata: